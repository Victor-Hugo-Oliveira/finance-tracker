name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinanceTracker.slnx

      - name: Build
        run: dotnet build FinanceTracker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FinanceTracker.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  publish:
    name: Publish site
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/FinanceTracker.Web -c Release -o publish

      # GitHub Pages serves the site from /<repository>/, not from the domain root.
      - name: Prepare for GitHub Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          cd publish/wwwroot
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|" index.html
          grep -q "<base href=\"$BASE_PATH\" />" index.html
          # Deep links (e.g. /dados) don't exist as files: serve the app and let its router decide.
          cp index.html 404.html
          # Jekyll would drop folders starting with "_" (_framework, _content).
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
